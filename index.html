<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>疊疊高</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d12;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="360" height="540" aria-label="疊疊高遊戲，點擊或按空白鍵放下方塊"></canvas>
<script>
(() => {
  const W = 360, H = 540, BH = 22, BASE_W = 140, BASE_Y = H - 110, PERFECT = 5;
  const cv = document.getElementById('c'), g = cv.getContext('2d');
  const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';

  function fit() {
    const s = Math.min(innerWidth / W, innerHeight / H), r = devicePixelRatio || 1;
    cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
    cv.width = W * s * r; cv.height = H * s * r;
    g.setTransform(s * r, 0, 0, s * r, 0, 0);
  }
  addEventListener('resize', fit); fit();

  // ---------- audio ----------
  let ac;
  function beep(freq, dur = .12, type = 'triangle', vol = .15) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), v = ac.createGain();
      o.type = type; o.frequency.value = freq;
      v.gain.setValueAtTime(vol, ac.currentTime);
      v.gain.exponentialRampToValueAtTime(.001, ac.currentTime + dur);
      o.connect(v); v.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + dur);
    } catch (e) {}
  }
  const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
  const note = i => 330 * Math.pow(2, SCALE[Math.min(i, SCALE.length - 1)] / 12);

  // ---------- state ----------
  let state = 'ready', tower, cur, debris, rings, streak, bestStreak, score, best = 0, cam, camT;
  let shake = 0, msg = null, overAt = 0, newRecord = false, t = 0;
  try { best = +localStorage.getItem('stack-best') || 0; } catch (e) {}

  function reset() {
    tower = [{ x: (W - BASE_W) / 2, w: BASE_W }];
    debris = []; rings = []; streak = 0; bestStreak = 0; score = 0; cam = 0; camT = 0;
    shake = 0; msg = null; newRecord = false;
    spawn(); state = 'play';
  }
  function spawn() {
    const n = tower.length, top = tower[n - 1], fromLeft = n % 2 === 0;
    cur = { x: fromLeft ? 0 : W - top.w, w: top.w, dir: fromLeft ? 1 : -1 };
  }
  const speed = () => Math.min(2.2 + tower.length * 0.07, 6.5);
  const wy = i => -i * BH;
  const sy = w => BASE_Y + w + cam;
  const hue = i => (200 + i * 7) % 360;

  function drop() {
    const n = tower.length, top = tower[n - 1];
    const dx = cur.x - top.x;
    if (Math.abs(dx) <= PERFECT) {
      streak++; bestStreak = Math.max(bestStreak, streak);
      let w = top.w, x = top.x;
      if (streak >= 4 && w < BASE_W) { const nw = Math.min(w + 8, BASE_W); x -= (nw - w) / 2; w = nw; x = Math.max(0, Math.min(W - w, x)); }
      tower.push({ x, w });
      rings.push({ x, w, i: n, t: 0 });
      beep(note(streak - 1), .18, 'triangle', .18);
      if (streak >= 2) msg = { text: '完美 ×' + streak, t: 0 };
      navigator.vibrate && navigator.vibrate(8);
    } else {
      const overlap = cur.w - Math.abs(dx);
      if (overlap <= 0) { fail(); return; }
      streak = 0;
      if (dx > 0) {
        debris.push({ x: cur.x + overlap, w: dx, wy: wy(n), vy: 0, vx: 1.2, i: n });
        tower.push({ x: cur.x, w: overlap });
      } else {
        debris.push({ x: cur.x, w: -dx, wy: wy(n), vy: 0, vx: -1.2, i: n });
        tower.push({ x: top.x, w: overlap });
      }
      beep(150, .1, 'square', .08);
      shake = 3;
    }
    score = tower.length - 1;
    camT = Math.max(0, (tower.length - 1) * BH - (BASE_Y - 250));
    spawn();
  }

  function fail() {
    debris.push({ x: cur.x, w: cur.w, wy: wy(tower.length), vy: 0, vx: 0, i: tower.length });
    state = 'over'; overAt = performance.now(); shake = 10;
    beep(110, .35, 'sawtooth', .12);
    if (score > best) { newRecord = score > 0; best = score; try { localStorage.setItem('stack-best', best); } catch (e) {} }
  }

  // ---------- update ----------
  function update() {
    t++;
    if (state === 'play') {
      cur.x += cur.dir * speed();
      if (cur.x < 0) { cur.x = 0; cur.dir = 1; }
      if (cur.x + cur.w > W) { cur.x = W - cur.w; cur.dir = -1; }
    }
    cam += (camT - cam) * 0.1;
    if (shake > 0) shake *= 0.85;
    for (const d of debris) { d.vy += 0.6; d.wy += d.vy; d.x += d.vx; }
    debris = debris.filter(d => sy(d.wy) < H + 60);
    for (const r of rings) r.t++;
    rings = rings.filter(r => r.t < 20);
    if (msg && ++msg.t > 50) msg = null;
  }

  // ---------- draw ----------
  function blockColor(i, light) { return `hsl(${hue(i)} 70% ${light ? 72 : 58}%)`; }
  function drawBlock(x, y, w, i) {
    g.fillStyle = blockColor(i); g.fillRect(x, y, w, BH - 1);
    g.fillStyle = blockColor(i, true); g.fillRect(x, y, w, 4);
  }
  function text(s, x, y, size, color, weight = 700, align = 'center') {
    g.font = `${weight} ${size}px ${FONT}`; g.fillStyle = color; g.textAlign = align; g.textBaseline = 'middle';
    g.fillText(s, x, y);
  }

  function render() {
    g.save();
    if (shake > .5) g.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    const h = hue(Math.max(score, 0));
    const grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, `hsl(${h} 45% 22%)`); grad.addColorStop(1, `hsl(${(h + 40) % 360} 50% 8%)`);
    g.fillStyle = grad; g.fillRect(-20, -20, W + 40, H + 40);

    if (tower) {
      tower.forEach((b, i) => { const y = sy(wy(i)); if (y > -BH && y < H + BH) drawBlock(b.x, y, b.w, i); });
      if (state === 'play') drawBlock(cur.x, sy(wy(tower.length)), cur.w, tower.length);
      for (const d of debris) { g.globalAlpha = .85; drawBlock(d.x, sy(d.wy), d.w, d.i); g.globalAlpha = 1; }
      for (const r of rings) {
        const k = r.t / 20, grow = k * 14;
        g.strokeStyle = `rgba(255,255,255,${1 - k})`; g.lineWidth = 2;
        g.strokeRect(r.x - grow, sy(wy(r.i)) - grow / 2, r.w + grow * 2, BH - 1 + grow);
      }
    }
    g.restore();

    if (state === 'play' || state === 'over') {
      text(String(score), W / 2, 70, 56, '#fff', 800);
      if (best > 0) text('最高 ' + best, W / 2, 112, 14, 'rgba(255,255,255,.6)', 500);
      if (msg) {
        const a = 1 - msg.t / 50;
        text(msg.text, W / 2, 150 - msg.t * .3, 22, `rgba(255,236,150,${a})`, 800);
      }
    }
    if (state === 'ready') {
      text('疊疊高', W / 2, 190, 44, '#fff', 800);
      text('方塊來回移動，在對齊時點一下', W / 2, 245, 14, 'rgba(255,255,255,.8)', 500);
      text('切掉的部分會掉落，越疊越窄', W / 2, 268, 14, 'rgba(255,255,255,.8)', 500);
      text('連續對齊三次以上，方塊會慢慢變寬', W / 2, 291, 14, 'rgba(255,255,255,.8)', 500);
      text('點擊或按空白鍵開始', W / 2, 360, 16, '#ffec96', 700);
      if (best) text('最高紀錄 ' + best + ' 層', W / 2, 400, 13, 'rgba(255,255,255,.6)', 500);
    }
    if (state === 'over') {
      g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(0, 160, W, 190);
      text(newRecord ? '新紀錄！' : '倒了', W / 2, 195, 26, newRecord ? '#ffec96' : '#fff', 800);
      let sub = `最長完美連擊 ${bestStreak}`;
      if (!newRecord && best - score > 0 && best - score <= 5) sub = `只差 ${best - score + 1} 層就破紀錄`;
      text(sub, W / 2, 235, 15, 'rgba(255,255,255,.85)', 500);
      text('再來一次', W / 2, 300, 18, '#ffec96', 700);
    }
  }

  // ---------- input ----------
  function press() {
    if (state === 'ready') { reset(); return; }
    if (state === 'play') { drop(); return; }
    if (state === 'over' && performance.now() - overAt > 350) reset();
  }
  addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!e.repeat) press(); }
  });
  cv.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
  cv.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- loop (fixed 60 Hz) ----------
  let prev = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(now - prev, 100); prev = now;
    while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
