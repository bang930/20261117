<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>下樓梯</title>
<style>
  html,body{margin:0;height:100%;background:#081417;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:#0f2a2e;image-rendering:pixelated}
</style>
</head>
<body>
<canvas id="c" width="360" height="540" aria-label="下樓梯遊戲"></canvas>
<script>
(() => {
  const W = 360, H = 540, CEIL = 22, MAXHP = 10, PW = 80;
  const cv = document.getElementById('c'), g = cv.getContext('2d');
  const FONT = '"Press Start 2P","Noto Sans TC","PingFang TC","Microsoft JhengHei",monospace';

  function fit() {
    const s = Math.min(innerWidth / W, innerHeight / H);
    cv.style.width = W * s + 'px';
    cv.style.height = H * s + 'px';
  }
  addEventListener('resize', fit); fit();

  // ---------- state ----------
  let state = 'title', pl, plats, hp, dist, floor, speed, shake, tick = 0, overAt = 0;
  let best = 0;
  try { best = +localStorage.getItem('stairs-best') || 0; } catch (e) {}

  const keys = {};
  const touches = new Map();
  let touchDir = 0;

  function reset() {
    pl = { x: W / 2 - 11, y: 120, w: 22, h: 26, vx: 0, vy: 0, on: null, inv: 0, face: 1 };
    plats = [];
    hp = MAXHP; dist = 0; floor = 0; speed = 1.1; shake = 0;
    const first = mkPlat(W / 2 - PW / 2, 150, 'normal');
    first.used = true;
    plats.push(first);
    pl.on = first; pl.y = first.y - pl.h;
    let y = 150;
    while (y < H + 70) { y += gap(); plats.push(mkPlat(rx(), y, pick())); }
  }
  const rx = () => 6 + Math.random() * (W - PW - 12);
  const gap = () => 64 + Math.random() * 26;
  function mkPlat(x, y, type) {
    return { x, y, w: PW, h: 12, type, used: false, t: -1, dir: Math.random() < .5 ? -1 : 1, comp: 0 };
  }
  function pick() {
    const d = Math.min(floor / 40, 1);
    const table = [['normal', 46 - 14 * d], ['conveyor', 15], ['fragile', 14], ['spring', 10], ['spike', 15 + 12 * d]];
    let sum = table.reduce((a, b) => a + b[1], 0), r = Math.random() * sum;
    for (const [t, w] of table) { if ((r -= w) < 0) return t; }
    return 'normal';
  }

  function hurt(n) {
    if (pl.inv > 0) return;
    hp -= n; pl.inv = 60; shake = 8;
    if (hp <= 0) { hp = 0; die(); }
  }
  function die() {
    state = 'over'; overAt = performance.now();
    if (floor > best) {
      best = floor;
      try { localStorage.setItem('stairs-best', best); } catch (e) {}
    }
  }

  // ---------- update ----------
  function overlapX(p) { return pl.x + pl.w > p.x + 2 && pl.x < p.x + p.w - 2; }

  function update() {
    tick++;
    speed = Math.min(1.1 + floor * 0.014, 3);
    dist += speed; floor = Math.floor(dist / 60);
    if (pl.inv > 0) pl.inv--;
    if (shake > 0) shake--;

    // scroll platforms upward
    for (const p of plats) {
      p.y -= speed;
      if (p.comp > 0) p.comp--;
      if (p.t >= 0) { p.t--; if (p.t < 0) p.gone = true; }
    }
    plats = plats.filter(p => !p.gone && p.y > -20);
    let last = plats.reduce((m, p) => Math.max(m, p.y), 0);
    while (last < H + 70) { last += gap(); plats.push(mkPlat(rx(), last, pick())); }

    // horizontal input
    const dir = (keys.ArrowRight || keys.d || keys.D ? 1 : 0) - (keys.ArrowLeft || keys.a || keys.A ? 1 : 0) || touchDir;
    pl.vx = dir * 3.4;
    if (dir) pl.face = dir;
    let belt = 0;

    // standing / falling
    let on = pl.on;
    if (on && !on.gone && overlapX(on)) {
      pl.y = on.y - pl.h; pl.vy = 0;
      if (on.type === 'conveyor') belt = on.dir * 1.5;
    } else {
      on = null; pl.vy = Math.min(pl.vy + 0.45, 9);
    }
    pl.x = Math.max(0, Math.min(W - pl.w, pl.x + pl.vx + belt));

    if (!on) {
      const oldB = pl.y + pl.h;
      pl.y += pl.vy;
      if (pl.vy >= 0) {
        for (const p of plats) {
          if (overlapX(p) && oldB <= p.y + speed + 6 && pl.y + pl.h >= p.y) {
            pl.y = p.y - pl.h; pl.vy = 0; on = p;
            land(p);
            break;
          }
        }
      }
    }
    pl.on = on;

    // ceiling
    if (pl.y < CEIL) {
      pl.y = CEIL; pl.vy = 2; pl.on = null;
      hurt(5);
    }
    // pit
    if (pl.y > H + 10) { hp = 0; shake = 12; die(); }
  }

  function land(p) {
    if (p.type === 'spring') {
      pl.vy = -11; p.comp = 10; pl.on = null; pl.y = p.y - pl.h - 1;
      return;
    }
    if (p.type === 'spike') {
      if (!p.used) hurt(4);
    } else if (!p.used && hp < MAXHP) hp++;
    if (p.type === 'fragile' && p.t < 0) p.t = 22;
    p.used = true;
    if (p.type === 'spring') pl.on = null;
  }

  // ---------- draw ----------
  function drawPlat(p) {
    const x = Math.round(p.x), y = Math.round(p.y);
    if (p.type === 'spike') {
      g.fillStyle = '#6b7a80'; g.fillRect(x, y, p.w, p.h);
      g.fillStyle = '#ff6b5a';
      for (let i = 0; i < 5; i++) {
        const sx = x + 4 + i * 15;
        g.beginPath(); g.moveTo(sx, y); g.lineTo(sx + 7, y - 9); g.lineTo(sx + 14, y); g.fill();
      }
      return;
    }
    if (p.type === 'fragile') {
      if (p.t >= 0 && (p.t >> 1) % 2) return;
      g.fillStyle = '#b79ee0'; g.fillRect(x, y, p.w, p.h);
      g.fillStyle = '#8a72b8';
      g.fillRect(x + 18, y, 2, p.h); g.fillRect(x + 40, y + 3, 2, p.h - 3); g.fillRect(x + 60, y, 2, p.h);
      return;
    }
    if (p.type === 'conveyor') {
      g.fillStyle = '#4f7391'; g.fillRect(x, y, p.w, p.h);
      g.fillStyle = '#9cc4e0';
      const off = (tick * 0.6 * p.dir) % 16;
      for (let i = -1; i < 6; i++) {
        const cx = x + ((i * 16 + off + 160) % 96) - 8 + 8;
        if (cx > x && cx < x + p.w - 6) {
          g.beginPath();
          if (p.dir > 0) { g.moveTo(cx, y + 2); g.lineTo(cx + 5, y + 6); g.lineTo(cx, y + 10); }
          else { g.moveTo(cx + 5, y + 2); g.lineTo(cx, y + 6); g.lineTo(cx + 5, y + 10); }
          g.fill();
        }
      }
      return;
    }
    g.fillStyle = '#d9c8a0'; g.fillRect(x, y, p.w, p.h);
    g.fillStyle = '#efe3c3'; g.fillRect(x, y, p.w, 3);
    if (p.type === 'spring') {
      const c = p.comp > 0 ? 4 : 12;
      g.fillStyle = '#7bd88f'; g.fillRect(x + 20, y - c, 40, c);
      g.fillStyle = '#3f9a55';
      for (let i = 3; i < c; i += 4) g.fillRect(x + 20, y - i, 40, 1);
    }
  }

  function drawPlayer() {
    if (pl.inv > 0 && (pl.inv >> 2) % 2) return;
    const x = Math.round(pl.x), y = Math.round(pl.y);
    g.fillStyle = '#ffd166'; g.fillRect(x + 2, y + 6, 18, 14);        // body
    g.fillStyle = '#ffe9a8'; g.fillRect(x + 4, y, 14, 10);             // head
    g.fillStyle = '#0f2a2e';
    g.fillRect(x + (pl.face > 0 ? 12 : 6), y + 3, 3, 3);                // eye
    g.fillStyle = '#e07a5f';
    const leg = (!pl.on || pl.vx === 0) ? 0 : ((tick >> 2) % 2) * 2;
    g.fillRect(x + 4, y + 20, 5, 6 - leg); g.fillRect(x + 13, y + 20, 5, 4 + leg);
    if (!pl.on) { g.fillStyle = '#ffd166'; g.fillRect(x - 2, y + 4, 3, 7); g.fillRect(x + 21, y + 4, 3, 7); } // arms up
  }

  function text(s, x, y, size, color, align = 'center') {
    g.font = size + 'px ' + FONT; g.fillStyle = color; g.textAlign = align; g.textBaseline = 'middle';
    g.fillText(s, x, y);
  }

  function drawScene() {
    g.save();
    if (shake > 0) g.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    // background: wall lines drifting upward
    g.fillStyle = '#0f2a2e'; g.fillRect(-10, -10, W + 20, H + 20);
    g.fillStyle = '#143a3f';
    const off = (dist * 0.5) % 54;
    for (let y = -54 + (54 - off); y < H; y += 54) g.fillRect(0, y, W, 2);
    g.fillRect(0, 0, 4, H); g.fillRect(W - 4, 0, 4, H);

    for (const p of plats) drawPlat(p);
    drawPlayer();

    // ceiling spikes
    g.fillStyle = '#ff9f43';
    for (let x = 0; x < W; x += 18) {
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 9, CEIL); g.lineTo(x + 18, 0); g.fill();
    }
    g.restore();

    // HUD
    for (let i = 0; i < MAXHP; i++) {
      g.fillStyle = i < hp ? (hp <= 3 ? '#ff6b5a' : '#7bd88f') : '#1d4a50';
      g.fillRect(10 + i * 14, CEIL + 8, 11, 10);
    }
    text('地下 ' + floor + ' 層', W - 10, CEIL + 14, 12, '#efe3c3', 'right');
  }

  function overlay(lines) {
    g.fillStyle = 'rgba(8,20,23,.82)'; g.fillRect(0, 0, W, H);
    lines.forEach(l => text(...l));
  }

  function render() {
    if (state === 'title') {
      if (!pl) reset();
      drawScene();
      overlay([
        ['下樓梯', W / 2, 190, 34, '#ffd166'],
        ['一路往下，別碰天花板', W / 2, 245, 13, '#efe3c3'],
        ['← → 或 A D 移動', W / 2, 300, 11, '#9cc4e0'],
        ['手機：按住畫面左／右半邊', W / 2, 322, 11, '#9cc4e0'],
        ['紫色會碎、紅刺扣血、綠色彈簧', W / 2, 356, 10, '#b79ee0'],
        ['按空白鍵或點一下開始', W / 2, 420, 13, '#7bd88f'],
        ['最高紀錄 地下 ' + best + ' 層', W / 2, 470, 10, '#6b7a80'],
      ]);
    } else if (state === 'play') {
      drawScene();
    } else {
      drawScene();
      overlay([
        ['遊戲結束', W / 2, 190, 28, '#ff6b5a'],
        ['你到了地下 ' + floor + ' 層', W / 2, 250, 16, '#efe3c3'],
        [floor >= best && floor > 0 ? '新紀錄！' : '最高紀錄 ' + best + ' 層', W / 2, 285, 12, '#ffd166'],
        ['按空白鍵或點一下再玩', W / 2, 360, 13, '#7bd88f'],
      ]);
    }
  }

  // ---------- input ----------
  function start() {
    if (state === 'over' && performance.now() - overAt < 500) return;
    if (state === 'play') return;
    reset(); state = 'play';
  }
  addEventListener('keydown', e => {
    keys[e.key] = true;
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
    if (e.key === ' ' || e.key === 'Enter') start();
  });
  addEventListener('keyup', e => { keys[e.key] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; touches.clear(); touchDir = 0; });

  function setTouch() {
    let d = 0;
    for (const v of touches.values()) d += v;
    touchDir = Math.max(-1, Math.min(1, d));
  }
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    const r = cv.getBoundingClientRect();
    touches.set(e.pointerId, (e.clientX - r.left) < r.width / 2 ? -1 : 1);
    setTouch(); start();
  });
  const up = e => { touches.delete(e.pointerId); setTouch(); };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointermove', e => {
    if (!touches.has(e.pointerId)) return;
    const r = cv.getBoundingClientRect();
    touches.set(e.pointerId, (e.clientX - r.left) < r.width / 2 ? -1 : 1);
    setTouch();
  });
  cv.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- loop (fixed 60 Hz) ----------
  let prev = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(now - prev, 100); prev = now;
    while (acc >= 1000 / 60) { if (state === 'play') update(); else tick++; acc -= 1000 / 60; }
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
